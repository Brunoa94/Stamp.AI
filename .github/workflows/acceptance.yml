name: Acceptance

# The acceptance suite against the test Supabase project, the Printify test shop and
# Stripe test mode (see tests/acceptance/README.md), split into groups that run in
# parallel. Called from ci.yml, which queues whole runs on the shared test environment.
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  # Excluded until their credentials exist in CI: Google sign-in, delivered email, PayPal and Mollie purchases.
  ACCEPTANCE_EXCLUDE: "Google|GOOGLE|google|AUTH-01 real email confirmation|AUTH-03 repeated signup|AUTH-07 reset via a delivered recovery email|PAY-01 PAY-02 ORDER-01 mollie|PAY-01 PAY-02 ORDER-01 paypal"

jobs:
  # Deploys once, before any group starts: concurrent deploys from every group would race.
  prepare:
    name: Prepare test project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Write test environment
        env:
          ACCEPTANCE_ENV_FILE: ${{ secrets.ACCEPTANCE_ENV_FILE }}
        run: |
          if [ -z "$ACCEPTANCE_ENV_FILE" ]; then echo "::error::Repository secret ACCEPTANCE_ENV_FILE is missing"; exit 1; fi
          printf '%s\n' "$ACCEPTANCE_ENV_FILE" > .env.test.local

      # Fails before touching the test project if a spec belongs to no group.
      - name: Plan acceptance groups
        id: plan
        run: node scripts/acceptance/ci-groups.mjs --grep-invert "$ACCEPTANCE_EXCLUDE"

      # The suite exercises the deployed test project, so bring its schema and
      # Edge Functions up to this branch first. Only the test project ref is
      # ever targeted here; production is deployed separately.
      - name: Deploy migrations and Edge Functions to the test project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
          SUPABASE_TEST_PROJECT_REF: tgccxydchvujhrqyzqao
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_TEST_DB_PASSWORD are required to deploy the test project"
            exit 1
          fi
          npx supabase link --project-ref "$SUPABASE_TEST_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase migration list --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --include-all --yes --password "$SUPABASE_DB_PASSWORD"
          npx supabase functions deploy --project-ref "$SUPABASE_TEST_PROJECT_REF" --use-api

      - name: Show catalog differences from production (CAT-04 fails on drift)
        run: node scripts/acceptance/sync-catalog.mjs

      - name: Remove test environment
        if: always()
        run: rm -f .env.test.local

  # Each group runs on its own runner, so it has its own app server, cleanup ledgers
  # and final cleanup; tests in different groups never share database rows.
  group:
    name: ${{ matrix.project }} · ${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-latest
    # Generous: a timeout kills the job before its Printify and account cleanup finishes.
    timeout-minutes: 60
    strategy:
      # A failing group must not cancel the others mid-run: cancelling skips their cleanup.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      # "Re-run failed jobs" reuses the earlier deploy, and another PR may have deployed since.
      - name: Require this attempt's deploy
        if: needs.prepare.outputs.attempt != github.run_attempt
        run: |
          echo "::error::Use \"Re-run all jobs\": the test project must be deployed again before acceptance groups run."
          exit 1

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -q && sudo apt-get install -y -q stripe

      - name: Write test environment
        env:
          ACCEPTANCE_ENV_FILE: ${{ secrets.ACCEPTANCE_ENV_FILE }}
        run: |
          if [ -z "$ACCEPTANCE_ENV_FILE" ]; then echo "::error::Repository secret ACCEPTANCE_ENV_FILE is missing"; exit 1; fi
          printf '%s\n' "$ACCEPTANCE_ENV_FILE" > .env.test.local

      - name: Run acceptance group
        env:
          PROJECT: ${{ matrix.project }}
          SPECS: ${{ matrix.specs }}
          # Each group starts its own dev server: load the app once before the first test.
          ACCEPTANCE_WARM_UP: 1
        run: |
          read -ra specs <<< "$SPECS"
          npm run test:acceptance -- --project="$PROJECT" --grep-invert "$ACCEPTANCE_EXCLUDE" "${specs[@]}"

      - name: Upload report and cleanup ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.group }}
          path: |
            .acceptance/report
            .acceptance/results
            .acceptance/accounts
            .acceptance/printify
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove test environment
        if: always()
        run: rm -f .env.test.local
