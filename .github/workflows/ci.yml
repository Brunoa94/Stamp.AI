name: CI

on:
  pull_request:
    # ready_for_review so a draft PR to main picks up the acceptance job once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Only main: changes reach dev through pull requests, which already run CI,
  # so a push trigger on dev would duplicate every check on the dev → main PR.
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch/PR: a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Integration suites (*.integration.test.ts) need a live Supabase and are
      # deliberately not run here; see `npm run test:integration`.
      - run: npm run test:unit
      - run: npm run test:acceptance:contracts

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Placeholder PUBLIC values only, so `next build` can inline them.
      # These are not secrets and never reach a deployment; Vercel injects
      # the real values at deploy time. Server-only secrets (Stripe, Printify,
      # OpenAI, PayPal, service role) are read at request time, not at build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the changed-files step can diff against the base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Full-repo lint. NON-BLOCKING for now: the repo carries a backlog of
      # ~866 pre-existing ESLint errors. Once that backlog is cleared, remove
      # `continue-on-error` so this step gates merges like the others.
      - name: ESLint (whole repo, advisory until backlog is cleared)
        continue-on-error: true
        run: npx eslint .

      # Blocking lint on the files this PR/push actually touched, so new
      # violations cannot land while the backlog above is being worked down.
      - name: ESLint (changed files, blocking)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Diffing against $BASE"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No lintable files changed."
            exit 0
          fi
          printf '%s\n' "${FILES[@]}"
          npx eslint --no-warn-ignored "${FILES[@]}"

  knip:
    name: Knip (unused files, exports and dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # NON-BLOCKING for now: the repo carries a backlog of ~158 knip findings.
      # Once that backlog is cleared, remove `continue-on-error` so this step
      # gates merges like the others.
      - name: Knip (advisory until backlog is cleared)
        continue-on-error: true
        run: npm run knip

  # Gate for merging into main: the full acceptance suite against the test
  # Supabase project, the Printify test shop and Stripe test mode
  # (see tests/acceptance/README.md). Only runs on non-draft PRs targeting
  # main (or a manual dispatch), after the cheaper jobs have passed.
  acceptance:
    name: Acceptance suite
    needs: [typecheck, unit-tests, build]
    # Secrets are not available to pull requests from forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'main' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Every run shares the test database and the Printify test shop: queue runs, never overlap them.
    concurrency:
      group: acceptance-test-environment
      cancel-in-progress: false
    env:
      # Excluded until their credentials exist in CI: Google sign-in, delivered email, PayPal and Mollie purchases.
      ACCEPTANCE_EXCLUDE: "Google|GOOGLE|google|AUTH-01 real email confirmation|AUTH-03 repeated signup|AUTH-07 reset via a delivered recovery email|PAY-01 PAY-02 ORDER-01 mollie|PAY-01 PAY-02 ORDER-01 paypal"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Install Stripe CLI
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -q && sudo apt-get install -y -q stripe

      - name: Write test environment
        env:
          ACCEPTANCE_ENV_FILE: ${{ secrets.ACCEPTANCE_ENV_FILE }}
        run: |
          if [ -z "$ACCEPTANCE_ENV_FILE" ]; then echo "::error::Repository secret ACCEPTANCE_ENV_FILE is missing"; exit 1; fi
          printf '%s\n' "$ACCEPTANCE_ENV_FILE" > .env.test.local

      - name: Show catalog differences from production (CAT-04 fails on drift)
        run: node scripts/acceptance/sync-catalog.mjs

      - name: Run acceptance suite
        run: npm run test:acceptance -- --grep-invert "$ACCEPTANCE_EXCLUDE"

      - name: Upload report and cleanup ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.run_id }}
          path: |
            .acceptance/report
            .acceptance/results
            .acceptance/accounts
            .acceptance/printify
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove test environment
        if: always()
        run: rm -f .env.test.local
